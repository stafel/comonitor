---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: monitor
  namespace: rmon
spec:
  selector:
    matchLabels:
      name: monitor
  
  template:
    metadata:
      labels:
        name: monitor
    
    spec:
      nodeSelector:
        monitor: co2

      containers:
        - name: comonitor
          image: harbor.maus.home.arpa/library/comonitor:v0.0.7
          ports:
            - name: webport
              containerPort: 8000
          volumeMounts:
            - name: monitordevice
              mountPath: /dev/comonitor
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-collector.grafana.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_TIMEOUT
              value: "10"
          securityContext:
            privileged: true
      
      volumes:
        - name: monitordevice
          hostPath:
            path: /dev/comonitor
            type: CharDevice # BlockDevice